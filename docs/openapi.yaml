openapi: 3.0.3

info:
  title: tabi-log API
  version: 0.1.0
  description: |
    旅行写真 SNS「tabi-log」の HTTP API 仕様。

    **このファイルが唯一の正である。** サーバーの型とクライアントの型は
    ここから生成する。実装からこのファイルを生成するのではない。

    前回プロジェクトでは実装から仕様書を生成しており、注釈の解釈違いによって
    「成功レスポンスが存在しない」仕様書が生成される事故を起こしている。
    ビルドもテストも通るため、生成物を目視するまで気づけなかった。
    向きを逆にすることで、実装が仕様から外れた場合は型検査の失敗として現れる。

    生成:
      - Go   : oapi-codegen  -> backend/internal/api/gen/
      - TS   : openapi-typescript -> frontend/src/lib/api/gen.ts
    CI で再生成し、差分が出ないことを検証する。

servers:
  - url: /api
    description: CloudFront（本番）および Vite の proxy（ローカル）が同一オリジンで振り分ける

tags:
  - name: health
    description: 稼働確認
  - name: master
    description: マスタデータ
  - name: auth
    description: 認証
  - name: posts
    description: 投稿と画像
  - name: reactions
    description: いいねとコメント
  - name: users
    description: プロフィールとフォロー
  - name: search
    description: 発見（絞り込み・検索・人気順）
  - name: notifications
    description: 通知

# 既定ですべてのエンドポイントが認証を要する。
# 認証不要のものは各操作で security: [] を明示して打ち消す。
# **既定を「不要」にすると、書き忘れが「認証なしで公開」になる**ため逆にしている。
security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: アカウントの作成
      description: |
        作成と同時にログイン状態にする。アクセストークンを本文で返し、
        リフレッシュトークンを Cookie に設定する。

        **メールアドレスの確認は行わない。** メール送信を対象外にしているため、
        存在しないアドレスでも登録できる（要件定義書 3.2 の割り切り）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 作成した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: メールアドレスかハンドルが既に使われている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン
      description: |
        **認証に失敗した理由を区別しない。** 「そのアドレスは登録されていない」と
        「パスワードが違う」を分けて返すと、どのアドレスが登録済みかを
        総当たりで調べられる。どちらも同じ `invalid_credentials` を返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログインした
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: メールアドレスかパスワードが正しくない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: アクセストークンの再発行
      description: |
        Cookie のリフレッシュトークンから新しいアクセストークンを発行し、
        **リフレッシュトークン自体もローテーションする**（新規発行＋旧失効）。

        **失効済みトークンの再提示は盗用の兆候とみなし、そのユーザーの
        全トークンを失効させる。** ただし正規のローテーション直後の短い猶予時間内は
        例外とする。タブを複数開いた利用者の同時リフレッシュを
        誤って盗用と判定し、正常な利用者をログアウトさせないためである。

        このエンドポイントは Cookie で認証するため CSRF の対象になる。
        `SameSite=Strict` に加えて `X-Requested-With: tabi-log` の付与を要求する。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      responses:
        '200':
          description: 再発行した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            リフレッシュトークンが無い・期限切れ・失効済みである。
            `code` が `token_reuse_detected` の場合は盗用とみなして
            全トークンを失効させており、再ログインが必要になる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CsrfRejected'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      description: |
        リフレッシュトークンを失効させ、Cookie を削除する。

        **発行済みのアクセストークンは最大15分間有効なままである。**
        取り消すにはリクエストごとに失効一覧を参照する必要があり、
        JWT を使う意味が薄れるため行わない。仕様上の制約として受け入れている。

        トークンが無い場合も 204 を返す（冪等）。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: ログアウトした（トークンが無い場合も含む）
          headers:
            Set-Cookie:
              description: リフレッシュトークンを削除する `Set-Cookie`
              schema:
                type: string
        '403':
          $ref: '#/components/responses/CsrfRejected'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン中の利用者
      description: アクセストークンが指す利用者を返す。画面の初期化に使う。
      responses:
        '200':
          description: ログイン中の利用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /media/presign:
    post:
      tags: [posts]
      operationId: presignMediaUpload
      summary: 画像アップロード用の署名付きURLを発行する
      description: |
        画像はブラウザから S3 へ直接送る。バックエンドを経由させないのは、
        大きなファイルでサーバーの帯域とタイムアウトがボトルネックになるのを
        避けるためである。

        **署名付きURLを発行する時点で `media` を `pending` として記録する。**
        「アップロードされる予定」を先に永続化しておかないと、送信後に投稿が
        確定されなかった分だけ S3 に誰も参照しないオブジェクトが溜まり続け、
        後から特定する手立てが無くなる。

        アップロード後、S3 のイベントで起動する処理が形式を検証し、
        **EXIF（GPS座標・撮影日時）を除去**して表示用の変換物を作る。
        その処理が完了して `processed` になった画像だけが投稿に使える。

        署名には Content-Type と最大サイズが焼き込まれる。条件に合わない
        アップロードは S3 側で拒否される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /media/{mediaId}:
    get:
      tags: [posts]
      operationId: getMediaStatus
      summary: 画像の処理状況
      description: |
        アップロードした画像の処理が終わったかを返す。

        **S3 への送信が終わっても、すぐには投稿に使えない。** 形式の検証・
        EXIF の除去・表示用の変換が終わって `processed` になる必要がある。
        その処理は S3 のイベントで非同期に走るため、**クライアントは
        完了を知る手段を持たない**。この経路がその手段になる。

        これが無いと、画面は「送信が終わった」時点で投稿できると誤解し、
        サーバーに拒否されて初めて分かることになる。

        自分がアップロードした画像のみ参照できる。
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 処理状況
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /search/posts:
    get:
      tags: [search]
      operationId: searchPosts
      summary: 投稿を探す
      description: |
        絞り込みの軸（都道府県 / 地方 / タグ / 投稿者 / 訪問日の期間 / キーワード）を
        **自由に組み合わせられる。** 何も指定しなければ新着フィードと同じ結果になる。

        **キーワードは本文とスポット名を対象に全文検索する。**
        `ngram` パーサ（トークン長2）を使うため、**1文字のキーワードは
        検索できない**（400 を返す）。既定のパーサでは日本語が一切ヒットしないので
        `ngram` は必須である。

        並び順は `sort` で選ぶ。

        | 値 | 意味 |
        |---|---|
        | `latest` | 投稿日の新しい順（既定） |
        | `popular` | いいね数の多い順。同数なら新しい順 |

        > **`popular` の「期間」は投稿日で絞る。** `since` を渡すと
        > 「その日以降に投稿されたもののうち、いいねの多い順」になる。
        > **「その期間に付いたいいねの数」ではない。** 後者は `likes` の
        > 期間集計になり、1画面ごとに全件を数えることになるため採らない。

        該当が無いときは、エラーではなく空の一覧を返す。
      parameters:
        - name: q
          in: query
          required: false
          description: キーワード。本文とスポット名を対象に全文検索する。**2文字以上**
          schema:
            type: string
            maxLength: 100
        - name: prefectureCode
          in: query
          required: false
          description: JIS X 0401 の都道府県コード
          schema:
            type: string
            pattern: '^[0-4][0-9]$'
        - name: region
          in: query
          required: false
          description: 地方（北海道 / 東北 / 関東 / 中部 / 近畿 / 中国 / 四国 / 九州沖縄）
          schema:
            type: string
            maxLength: 10
        - name: tag
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: handle
          in: query
          required: false
          description: 投稿者のハンドル
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]+$'
            maxLength: 30
        - name: visitedFrom
          in: query
          required: false
          description: 訪問日の下限（この日を含む）
          schema:
            type: string
            format: date
        - name: visitedTo
          in: query
          required: false
          description: 訪問日の上限（この日を含む）
          schema:
            type: string
            format: date
        - name: since
          in: query
          required: false
          description: 投稿日の下限。`sort=popular` の「期間」を決める
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [latest, popular]
            default: latest
        - name: cursor
          in: query
          required: false
          description: |
            前回の応答の `nextCursor`。**並び順ごとに形が違う**ため、
            `sort` を変えたら渡し直さずに先頭から取り直すこと。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 投稿の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /search/users:
    get:
      tags: [search]
      operationId: searchUsers
      summary: 利用者を探す
      description: |
        ハンドルと表示名を対象に、**部分一致**で探す。

        > **前方一致ではなく部分一致にしているため索引が効かない。**
        > 想定利用者数は2000人であり、全件走査でも問題にならない規模である。
        > 桁が変わるなら、検索そのものを OpenSearch 側へ移す判断になる。
      parameters:
        - name: q
          in: query
          required: true
          description: 探したい語。**2文字以上**
          schema:
            type: string
            minLength: 2
            maxLength: 50
        - $ref: '#/components/parameters/UserCursor'
        - $ref: '#/components/parameters/UserLimit'
      responses:
        '200':
          description: 利用者の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /feed/following:
    get:
      tags: [posts]
      operationId: listFollowingFeed
      summary: フォロー中フィード
      description: |
        **自分がフォローしている利用者**の投稿を投稿日の新しい順に返す。
        カーソルの扱いは新着フィードと同じ。

        **自分の投稿は含まない。** 自分自身はフォローできないため、
        「フォローしている人の投稿」に自分は入らない。
        自分の投稿はプロフィールで見る。

        > **ここは負荷試験の対象である。** 想定は1人あたり平均200フォロー。
        > 絞り込みの元が `follows` の走査になるため、フォロー数が増えると
        > 1ページ返すのに読む行が増える。実測して必要なら作り方を変える。
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前回の応答の `nextCursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 投稿の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users/me:
    patch:
      tags: [users]
      operationId: updateProfile
      summary: プロフィールを編集する
      description: |
        表示名と自己紹介を変える。**送られた項目だけを変える。**
        省略された項目は現在の値のままにする。

        **自己紹介を消すときは空文字を送る。** `null` と「省略」を
        JSON の復号後に区別するには生の本文を見る必要があり、
        仕組みが増えるわりに得るものが無い。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 更新した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    delete:
      tags: [users]
      operationId: deleteAccount
      summary: 退会する
      description: |
        **取り消せない。** 現在のパスワードの入力を必須とする。

        物理削除ではなく、次を行う（features.md 1.5）。

        1. `deleted_at` を設定する
        2. メールアドレスを復元不能な値に置き換え、表示名を「退会したユーザー」、
           自己紹介を空にする
        3. 投稿・コメント・いいね・フォロー・メディアを削除する。
           **S3 のオブジェクトも明示的に消す**（外部キーの連鎖では消えない）
        4. **ハンドルは解放せず保持する。** 解放すると、別人が同じハンドルを
           取れてしまい、過去のリンクの指す先が変わる

        リフレッシュトークンも失効させ、Cookie を消す。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: 退会した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users/me/avatar:
    put:
      tags: [users]
      operationId: setAvatar
      summary: アバターを設定する
      description: |
        **画像は投稿と同じ経路で先にアップロードする**
        （`/media/presign` → S3 へ直接 PUT → 処理の完了を待つ）。
        アバターにも EXIF の除去が要るため、経路を分けない。

        使えるのは、**自分がアップロードし、処理が完了しており、
        まだどの投稿にも使われていない**画像に限る。
        条件に合わなければ 400 を返す。**理由は区別しない**
        （他人の画像の ID を総当たりして存在を調べられないようにするため）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAvatarRequest'
      responses:
        '204':
          description: 設定した
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    delete:
      tags: [users]
      operationId: clearAvatar
      summary: アバターを外す
      description: |
        **冪等である。** 設定していなくても 204 を返す。

        画像そのものは消さない。退会時にまとめて削除する。
      responses:
        '204':
          description: 外した（設定していなかった場合も含む）
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users/me/password:
    put:
      tags: [users]
      operationId: changePassword
      summary: パスワードを変更する
      description: |
        **現在のパスワードの入力を必須とする。** 端末を離席した隙に
        変えられるのを防ぐためである。

        **変更後はそのユーザーの全リフレッシュトークンを失効させる。**
        パスワードを変える理由が漏洩の疑いである場合、既存のセッションが
        残るのは意図に反する。呼び出した側も入り直しになる。

        > **発行済みのアクセストークンは最大15分間有効なまま**である。
        > 失効させるにはブラックリストが要り、結局データベース参照になるため
        > 採らない（tech-stack.md の割り切り）。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 変更した
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users/{handle}/travels:
    parameters:
      - $ref: '#/components/parameters/Handle'

    get:
      tags: [users]
      operationId: listUserTravels
      summary: 旅行履歴（訪問日順）
      description: |
        **投稿日ではなく訪問日の新しい順に返す。**

        時間軸が2つあるのは、旅行から帰ったあとにまとめて投稿するのが
        自然な使われ方だからである。フィードは「新しく共有されたもの」を
        見せる場、旅行履歴は「いつ行ったか」を並べる場である。

        カーソルは `<訪問日>_<投稿ID>` の形になる。**訪問日は重複する**ため、
        日付だけでは同じ日の中のどこまで返したかを表せない。
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前回の応答の `nextCursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 投稿の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{handle}:
    parameters:
      - $ref: '#/components/parameters/Handle'

    get:
      tags: [users]
      operationId: getUserProfile
      summary: プロフィールを取得する
      description: |
        ハンドルで引く。**id ではなくハンドルを URL に使う。**
        利用者が人に伝えられる識別子であり、`/users/traveler_01` のほうが
        `/users/42` より意味が伝わるためである。

        投稿数・フォロー数・フォロワー数は集計で求める。カウンタ列にしていないのは、
        **プロフィールは1画面につき1回しか開かれず、フィードのように
        20件分を繰り返し引く経路が無い**ためである。いいね数とは事情が違う。
      responses:
        '200':
          description: プロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{handle}/follow:
    parameters:
      - $ref: '#/components/parameters/Handle'

    put:
      tags: [users]
      operationId: followUser
      summary: フォローする
      description: |
        **冪等である。** 既にフォローしていても 204 を返す。
        いいねと同じ理由で PUT にしている（「この相手へのフォローを、有る状態にする」）。

        **自分自身はフォローできない**（400）。DB の CHECK 制約でも防いでいるが、
        制約違反が 500 になるのを避けるためアプリケーション側でも判定する。

        フォローされた相手に通知を作る。作成はフォローの登録と同一トランザクションで行う。
      responses:
        '204':
          description: フォローした（既にしていた場合も含む）
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [users]
      operationId: unfollowUser
      summary: フォローを解除する
      description: |
        **冪等である。** フォローしていなくても 204 を返す。

        解除すると、対応する通知も削除する。
      responses:
        '204':
          description: 解除した（していなかった場合も含む）
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{handle}/prefectures:
    parameters:
      - $ref: '#/components/parameters/Handle'

    get:
      tags: [users]
      operationId: listUserPrefectures
      summary: 都道府県ごとの投稿数
      description: |
        都道府県制覇マップのためのデータ。

        **投稿が無い県も含めて47件すべてを返す。** マップは全県のマスを
        描くため、返さないと画面側で都道府県マスタと突き合わせる処理が要る。
        47件は固定であり、量として問題にならない。

        並びは `sort_order`（JIS X 0401 の順）である。
      responses:
        '200':
          description: 都道府県ごとの投稿数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefectureCountListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{handle}/posts:
    parameters:
      - $ref: '#/components/parameters/Handle'

    get:
      tags: [users]
      operationId: listUserPosts
      summary: その利用者の投稿
      description: |
        投稿日の新しい順に返す。カーソルの扱いは新着フィードと同じ。

        **訪問日順の「旅行履歴」は別の並びであり、ここには含めない。**
        時間軸が2つあることを画面の切り替えで表す（features.md 1.3）。
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前回の応答の `nextCursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 投稿の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{handle}/followers:
    parameters:
      - $ref: '#/components/parameters/Handle'
      - $ref: '#/components/parameters/UserCursor'
      - $ref: '#/components/parameters/UserLimit'

    get:
      tags: [users]
      operationId: listFollowers
      summary: フォロワーの一覧
      description: |
        その利用者をフォローしている人を返す。

        **並びは利用者 id の昇順であり、フォローした順ではない。**
        `follows` の索引が `(followee_id, follower_id)` であり、
        この順でのみカーソルが索引で解決できるためである。
        フォロー日時順にするには索引の追加が要る。
      responses:
        '200':
          description: 利用者の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{handle}/following:
    parameters:
      - $ref: '#/components/parameters/Handle'
      - $ref: '#/components/parameters/UserCursor'
      - $ref: '#/components/parameters/UserLimit'

    get:
      tags: [users]
      operationId: listFollowing
      summary: フォロー中の一覧
      description: |
        その利用者がフォローしている人を返す。並びは `listFollowers` と同じ理由で
        利用者 id の昇順である。
      responses:
        '200':
          description: 利用者の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: 新着フィード
      description: |
        全利用者の投稿を投稿日の新しい順に返す。

        **カーソルページネーションを使う。** `OFFSET` は深いページで
        件数分を読み飛ばすため劣化する。前回の最後の投稿を指す `cursor` を
        渡すと、その続きから返す。

        並び順は**投稿日**であり訪問日ではない。旅行から帰ったあとに
        まとめて投稿するのが自然な使われ方であり、フィードは
        「新しく共有されたもの」を見せる場だからである。
        訪問日順で見せるのはプロフィールの旅行履歴の役割になる。
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前回の応答の `nextCursor`。省略すると先頭から返す
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 投稿の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      tags: [posts]
      operationId: createPost
      summary: 投稿を作成する
      description: |
        画像・本文・都道府県・訪問日・タグをまとめて確定する。

        **投稿本体・画像の紐づけ・タグの登録を1つのトランザクションで行う。**
        分かれていると、途中で失敗したときに「画像の無い投稿」や
        「どの投稿にも属さない画像」が残る。

        指定できる画像は、**自分がアップロードし、処理が完了しており
        （`processed`）、まだどの投稿にも紐づいていないもの**に限る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /posts/{postId}/likes:
    parameters:
      - $ref: '#/components/parameters/PostId'

    put:
      tags: [reactions]
      operationId: likePost
      summary: いいねする
      description: |
        **冪等である。** 既にいいねしていても 204 を返す。
        POST ではなく PUT にしているのはそのためで、
        「この投稿に対する自分のいいねを、有る状態にする」という意味になる。

        二重のいいねは複合主キー `(user_id, post_id)` が防ぐ。

        **`posts.like_count` の増減をいいねの登録と同一トランザクションで行う。**
        フィードは1画面で20件返すため、都度 `COUNT` を撃つと20件それぞれに
        集計が走る（N+1 の温床）。カウンタ列にする代わりに、
        整合性はトランザクションで担保する。

        自分の投稿にもいいねできる。ただし**自分への通知は作らない**。
      responses:
        '204':
          description: いいねした（既にしていた場合も含む）
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [reactions]
      operationId: unlikePost
      summary: いいねを取り消す
      description: |
        **冪等である。** いいねしていなくても 204 を返す。

        取り消すと、対応する通知も削除する。
      responses:
        '204':
          description: 取り消した（していなかった場合も含む）
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'

    get:
      tags: [reactions]
      operationId: listComments
      summary: コメントの一覧
      description: |
        古い順に返す。会話は上から読むものであり、フィードのように
        新しいものから見るのは適さないためである。

        **返信ツリーは作らない**（要件定義書 3.2 の対象外）。1階層に固定する。
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前回の応答の `nextCursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: コメントの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [reactions]
      operationId: createComment
      summary: コメントする
      description: |
        **`posts.comment_count` の増減をコメントの登録と同一トランザクションで行う。**

        自分の投稿にもコメントできる。ただし**自分への通知は作らない**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /comments/{commentId}:
    delete:
      tags: [reactions]
      operationId: deleteComment
      summary: コメントを削除する
      description: |
        削除できるのは**コメントを書いた本人と、投稿の作成者**の両方である。

        投稿者に削除させないと、自分の投稿に付いた不快なコメントを消す手段が
        「投稿ごと消す」しか無くなる。
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'

    get:
      tags: [posts]
      operationId: getPost
      summary: 投稿を取得する
      responses:
        '200':
          description: 投稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [posts]
      operationId: updatePost
      summary: 投稿を編集する
      description: |
        **画像の差し替えは対象外**（要件定義書 3.2）。本文・都道府県・
        スポット名・訪問日・タグ・代替テキストを変更できる。

        **自分の投稿であることをサーバー側で検証する。**
        画面側の制御は操作性のためであり、権限の根拠にはしない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: 更新した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [posts]
      operationId: deletePost
      summary: 投稿を削除する
      description: |
        コメント・いいね・タグの紐づけ・画像が連鎖して削除される。
        S3 上のオブジェクトはデータベースの制約では消えないため、
        アプリケーションから明示的に削除する。
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: 通知の一覧
      description: |
        自分あての通知を新しい順に返す。

        **通知は契機となる操作と同一トランザクションで作られる。**
        キューや Outbox は使わない（「いいねは記録されたが通知が消えた」
        状態を作らないための最も単純な方法である）。

        契機が取り消されると通知も消える。いいねの解除・フォローの解除は
        その場で削除し、投稿やコメントの削除は外部キーの連鎖で消える。
      parameters:
        - name: cursor
          in: query
          required: false
          description: 前回の応答の `nextCursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 通知の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getUnreadNotificationCount
      summary: 未読の件数
      description: |
        画面の見出しに出す数のためだけの軽い問い合わせ。

        **一覧を取らずに数だけ分かる必要がある。** 数を出すために
        毎回20件ぶんの本体を取ってくるのは無駄が大きい。
      responses:
        '200':
          description: 未読の件数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/read:
    put:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: すべて既読にする
      description: |
        **冪等である。** 未読が無くても 204 を返す。
      responses:
        '204':
          description: 既読にした（未読が無かった場合も含む）
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/{notificationId}/read:
    put:
      tags: [notifications]
      operationId: markNotificationRead
      summary: 1件を既読にする
      description: |
        **冪等である。** 既に既読でも 204 を返す。

        **他人あての通知は既読にできない**（404）。存在しない場合と
        区別しないのは、id を総当たりして他人の通知の有無を
        調べられないようにするためである。
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: 既読にした（既に既読だった場合も含む）
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /prefectures:
    get:
      tags: [master]
      operationId: listPrefectures
      summary: 都道府県マスタの一覧
      description: |
        47件を JIS X 0401 のコード順で返す。投稿フォームの選択肢と、
        都道府県制覇マップの土台に使う。

        **認証を要さない。** 総務省が定める公開情報であり、
        利用者ごとに内容が変わらないためである。
        （アプリの他の画面は認証を要する。[要件定義書](requirements.md) 2 章）

        内容は不変なので、クライアントは長期間キャッシュしてよい。
      security: []
      responses:
        '200':
          description: 47件の都道府県
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefectureListResponse'
  /livez:
    get:
      tags: [health]
      operationId: getLivez
      summary: プロセスの生存確認
      description: |
        **依存先を一切見ない。** ロードバランサのヘルスチェックはこちらへ向ける。

        依存先まで確認するヘルスチェックをロードバランサに向けると、
        データベースが一時的に不調になったときに全タスクが同時に unhealthy と
        判定されて一斉に置き換えられる。置き換えてもデータベースは回復しないため
        状況が悪化するだけである。タスクを入れ替えるべき理由になるのは
        「プロセスが生きていないこと」だけである。
      security: []
      responses:
        '200':
          description: プロセスは動作している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: 依存先を含む疎通確認
      description: |
        データベースへの疎通を含めて確認する。デプロイ時の投入判定や
        運用中の状況確認に使う。**ロードバランサのヘルスチェックには使わない。**
      security: []
      responses:
        '200':
          description: すべての依存先へ疎通できる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: いずれかの依存先へ疎通できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    Handle:
      name: handle
      in: path
      required: true
      description: 利用者のハンドル。英数字とアンダースコアのみ
      schema:
        type: string
        pattern: '^[A-Za-z0-9_]+$'
        minLength: 3
        maxLength: 30

    UserCursor:
      name: cursor
      in: query
      required: false
      description: 前回の応答の `nextCursor`
      schema:
        type: string

    UserLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: |
        CSRF 対策。値は `tabi-log` 固定。

        カスタムヘッダーは単純リクエストの条件を外れるため、
        クロスオリジンから送るには CORS のプリフライトが通る必要がある。
        フォーム送信や `<img>` のような**プリフライトを伴わない経路では付けられない**。
        `SameSite=Strict` と合わせて二重に守る。
      schema:
        type: string
        enum: [tabi-log]

  headers:
    RefreshTokenCookie:
      description: |
        リフレッシュトークンを設定する `Set-Cookie`。

        `HttpOnly` `Secure` `SameSite=Strict` を付け、
        **`Path=/api/auth` に限定する**。投稿や検索といった他の API リクエストには
        一切乗らないため、Cookie が晒される面が小さくなる。

        `/api/auth/refresh` まで絞らないのは、**ログアウトでも Cookie を読んで
        サーバー側で失効させる必要がある**ためである。より狭い Path にすると
        `/api/auth/logout` へ Cookie が送られず、ブラウザ側で消すことしかできない。
      schema:
        type: string

  responses:
    ValidationError:
      description: 入力が要件を満たしていない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthenticated:
      description: アクセストークンが無い、期限切れ、または不正である
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    CsrfRejected:
      description: CSRF 対策のヘッダーが無い、または値が正しくない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: 試行回数の上限に達した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 権限が無い（他人の投稿を操作しようとした等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        アクセストークン（JWT・15分）を Authorization ヘッダで送る。

        クライアントはこのトークンを **JavaScript のメモリにのみ保持し、
        localStorage には保存しない**。リロード時はリフレッシュトークン
        （HttpOnly Cookie）から再取得する。

        ヘッダ方式にしていることで、通常の API は CSRF の対象外になる。
        Cookie を用いるのは /auth/refresh と /auth/logout の2本のみである。

  schemas:
    # -----------------------------------------------------------------------
    # 共通のエンベロープ
    #
    # 成功は data、失敗は error で包む。生の値を返さないのは、後から
    # ページネーション情報やメタデータを足すときに形を壊さないためである。
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                機械可読な識別子。**クライアントはこちらで分岐すること。**
                message は表示専用であり、文言の変更で分岐が壊れないようにする。
              example: dependency_unavailable
            message:
              type: string
              description: 利用者に表示する説明。内部構造やスタックは含めない。
              example: データベースへ接続できません

    # -----------------------------------------------------------------------
    # 認証
    # -----------------------------------------------------------------------
    SignupRequest:
      type: object
      required: [email, handle, displayName, password]
      properties:
        email:
          type: string
          # format: email はあえて付けない。
          # コード生成器が専用の型を作り、その型が JSON の復号時に
          # 形式検証を行うため、**どの項目が不正なのかを利用者へ返せなくなる**
          # （本文全体の「形式が正しくありません」に丸められる）。
          # 検証はアプリケーション側で行い、項目ごとの説明を返す。
          description: メールアドレス。ログインIDとして使う
          maxLength: 255
          example: traveler@example.com
        handle:
          type: string
          description: URL に使う識別子。英数字とアンダースコアのみ
          pattern: '^[A-Za-z0-9_]+$'
          minLength: 3
          maxLength: 30
          example: traveler_01
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          example: たびびと
        password:
          type: string
          format: password
          description: |
            8文字以上。**上限を 72 にしているのは bcrypt の制約**である。
            bcrypt は 72 バイトを超える入力を切り捨てるため、
            それ以上を受け付けると「長いほど安全」という利用者の期待を裏切る。
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: メールアドレス
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, expiresIn, user]
          properties:
            accessToken:
              type: string
              description: |
                JWT。`Authorization: Bearer <token>` で送る。

                **クライアントはこれをメモリにのみ保持し、localStorage に
                保存しない。** 保存すると XSS で読み出せてしまう。
                リロード時は `/auth/refresh` から取り直す。
            expiresIn:
              type: integer
              description: アクセストークンの残り有効秒数
              example: 900
            user:
              $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    User:
      type: object
      description: 公開してよい利用者情報のみを含む。メールアドレスは含めない
      required: [id, handle, displayName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        handle:
          type: string
          example: traveler_01
        displayName:
          type: string
          example: たびびと
        bio:
          type: string
          nullable: true
          maxLength: 300
        avatarUrl:
          type: string
          nullable: true
          description: |
            アバターの表示用URL（署名付き、有効期間つき）。
            設定していなければ null。**画面は必ず未設定の場合を描けること。**
        isFollowing:
          type: boolean
          description: |
            閲覧者がこの利用者をフォローしているか。

            **一覧に出す利用者ぶんをまとめて解決している。** 投稿カードから
            その場でフォローできるようにするために持たせている。
        isMe:
          type: boolean
          description: 閲覧者自身か。自分にフォローの導線を出さないために使う

    # -----------------------------------------------------------------------
    # プロフィールとフォロー
    # -----------------------------------------------------------------------
    UserSummary:
      type: object
      description: 一覧に並べる利用者。フォローの導線を出すための状態を含む
      required: [id, handle, displayName, isFollowing, isMe]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: アバターの表示用URL。設定していなければ null
        isFollowing:
          type: boolean
          description: 閲覧者がこの利用者をフォローしているか
        isMe:
          type: boolean
          description: 閲覧者自身か。自分にフォローの導線を出さないために使う

    UserProfile:
      type: object
      required:
        [
          id,
          handle,
          displayName,
          postCount,
          followingCount,
          followerCount,
          visitedPrefectureCount,
          isFollowing,
          isMe
        ]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        handle:
          type: string
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: アバターの表示用URL。設定していなければ null
        postCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
        followerCount:
          type: integer
          minimum: 0
        visitedPrefectureCount:
          type: integer
          minimum: 0
          maximum: 47
          description: |
            投稿した都道府県の種類数。制覇率は 47 で割って画面が求める。
            **地図そのものは 8 章で作る。** ここでは数だけを返す。
        isFollowing:
          type: boolean
        isMe:
          type: boolean

    UserProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UserProfile'

    UserListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [users]
          properties:
            users:
              type: array
              items:
                $ref: '#/components/schemas/UserSummary'
            nextCursor:
              type: string
              nullable: true
              description: 続きがある場合のみ入る

    UpdateProfileRequest:
      type: object
      description: 送られた項目だけを変える。省略した項目は現在の値のまま
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 300
          description: 空文字を送ると消す。省略した場合は変えない

    SetAvatarRequest:
      type: object
      required: [mediaId]
      properties:
        mediaId:
          type: integer
          format: int64
          minimum: 1
          description: アップロードして処理が完了した画像のID

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    DeleteAccountRequest:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          description: 取り消せない操作のため、本人であることを確かめる

    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    PrefectureCount:
      type: object
      required: [code, name, region, postCount]
      properties:
        code:
          type: string
          description: JIS X 0401 の都道府県コード
        name:
          type: string
        region:
          type: string
        postCount:
          type: integer
          minimum: 0

    PrefectureCountListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [prefectures]
          properties:
            prefectures:
              type: array
              items:
                $ref: '#/components/schemas/PrefectureCount'

    # -----------------------------------------------------------------------
    # 通知
    # -----------------------------------------------------------------------
    Notification:
      type: object
      required: [id, type, actor, isRead, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [like, comment, follow]
          x-enum-varnames: [NotificationLike, NotificationComment, NotificationFollow]
        actor:
          $ref: '#/components/schemas/User'
          description: 通知の契機を作った利用者
        postId:
          type: integer
          format: int64
          nullable: true
          description: like と comment に入る。画面はこれで投稿へ飛ぶ
        commentBody:
          type: string
          nullable: true
          description: |
            comment に入る。**一覧に本文の頭を出すために持たせる。**
            通知を開くたびにコメントを取りに行くと、20件で20往復になる
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [notifications]
          properties:
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
            nextCursor:
              type: string
              nullable: true

    UnreadCountResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [unreadCount]
          properties:
            unreadCount:
              type: integer
              minimum: 0

    # -----------------------------------------------------------------------
    # 投稿と画像
    # -----------------------------------------------------------------------
    PresignRequest:
      type: object
      required: [contentType, contentLength]
      properties:
        contentType:
          type: string
          description: |
            画像の種類。**この値は署名に焼き込まれる**ため、
            異なる種類でアップロードすると S3 が拒否する。

            ただし申告値を信用はしない。アップロード後に
            マジックバイトで実際の形式を検証する。
          enum: [image/jpeg, image/png, image/webp]
        contentLength:
          type: integer
          format: int64
          description: バイト数。上限も署名に焼き込まれる
          minimum: 1
          maximum: 10485760

    PresignResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [mediaId, uploadUrl, expiresIn]
          properties:
            mediaId:
              type: integer
              format: int64
              description: 投稿を作成するときにこの ID を指定する
            uploadUrl:
              type: string
              description: この URL へ PUT する。**サーバーを経由しない**
            expiresIn:
              type: integer
              description: 署名の有効秒数

    CreatePostRequest:
      type: object
      required: [body, prefectureCode, media]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
        prefectureCode:
          type: string
          description: JIS X 0401 の都道府県コード。**必須**。自由入力は受け付けない
          pattern: '^[0-4][0-9]$'
        spotName:
          type: string
          maxLength: 100
          nullable: true
          description: 「道の駅○○」など。全文検索の対象に含める
        visitedOn:
          type: string
          format: date
          nullable: true
          description: |
            訪問日。**投稿日とは別の軸である。** 旅行から帰ったあとに
            まとめて投稿するのが自然な使われ方のため。未来日は受け付けない。

            **任意である。** 覚えていない・特定の日に紐づかない投稿もあるため。
            **省略した投稿は旅行履歴（訪問日順）に出ない。**
            並べる軸そのものが無いためである。
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 50
        media:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/PostMediaInput'

    UpdatePostRequest:
      type: object
      required: [body, prefectureCode]
      description: |
        画像の差し替えはできない。本文・都道府県・スポット名・訪問日・タグを変える。
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
        prefectureCode:
          type: string
          pattern: '^[0-4][0-9]$'
        spotName:
          type: string
          maxLength: 100
          nullable: true
        visitedOn:
          type: string
          format: date
          nullable: true
          description: null を送ると訪問日を消す
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 50

    PostMediaInput:
      type: object
      required: [mediaId]
      properties:
        mediaId:
          type: integer
          format: int64

    MediaStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [mediaId, status]
          properties:
            mediaId:
              type: integer
              format: int64
            status:
              type: string
              description: |
                `pending`   … 署名付きURLを発行したが、まだ届いていない
                `uploaded`  … 届いたが処理中
                `processed` … **投稿に使える**
                `failed`    … 画像として扱えなかった。投稿には使えない
              enum: [pending, uploaded, processed, failed]

    PostResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Post'

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500

    CommentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Comment'

    CommentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            nextCursor:
              type: string
              nullable: true
              description: 次のページを取るときに `cursor` として渡す。これ以上無い場合は null

    Comment:
      type: object
      required: [id, author, body, createdAt, canDelete]
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/User'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        canDelete:
          type: boolean
          description: |
            このコメントを削除できるか。**表示の出し分けのためだけに使う。**

            権限そのものはサーバー側で判定しており、この値を書き換えても
            削除はできない。画面がボタンを出すかどうかを決めるための情報である。

    PostListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [posts]
          properties:
            posts:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            nextCursor:
              type: string
              nullable: true
              description: |
                次のページを取るときに `cursor` として渡す。
                **これ以上無い場合は null になる。** 空文字ではなく null に
                しているのは、「続きがない」ことを呼び出し側が
                真偽で判定できるようにするためである。

    Post:
      type: object
      required:
        [
          id,
          author,
          body,
          prefecture,
          media,
          tags,
          likeCount,
          commentCount,
          isLiked,
          canDelete,
          createdAt
        ]
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/User'
        body:
          type: string
        prefecture:
          $ref: '#/components/schemas/Prefecture'
        spotName:
          type: string
          nullable: true
        visitedOn:
          type: string
          format: date
          nullable: true
          description: 訪問日。省略された投稿では null
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        tags:
          type: array
          items:
            type: string
        likeCount:
          type: integer
        commentCount:
          type: integer
        isLiked:
          type: boolean
          description: |
            **この投稿に自分がいいねしているか。**

            フィードでは表示する20件それぞれについて必要になる。
            投稿ごとに問い合わせると N+1 になるため、
            `likes` の主キーを `(user_id, post_id)` の順にしてあり、
            `WHERE user_id = ? AND post_id IN (...)` の1クエリで解決する。
        canDelete:
          type: boolean
          description: |
            この投稿を削除できるか。**表示の出し分けのためだけに使う。**
            権限はサーバー側で判定しており、この値を書き換えても削除はできない。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Media:
      type: object
      required: [id, width, height, thumbUrl, mediumUrl]
      properties:
        id:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        thumbUrl:
          type: string
          description: 長辺320px。一覧で使う
        mediumUrl:
          type: string
          description: 長辺1080px。詳細で使う

    Prefecture:
      type: object
      required: [code, name, nameKana, region]
      properties:
        code:
          type: string
          description: JIS X 0401 の都道府県コード。`01`〜`47` の2桁（先頭のゼロを含む）
          pattern: '^[0-4][0-9]$'
          example: '01'
        name:
          type: string
          example: 北海道
        nameKana:
          type: string
          description: 読み。並べ替えと検索の補助に使う
          example: ほっかいどう
        region:
          type: string
          description: 八地方区分。「関東の投稿」のような粒度での絞り込みに使う
          enum: [北海道, 東北, 関東, 中部, 近畿, 中国, 四国, 九州沖縄]
          # コード生成器は日本語の列挙値から識別子を作れず、
          # Empty / N1 / N2 ... という無意味な定数名を出す（Empty が「北海道」になる）。
          # x-enum-varnames で明示的に名前を与える。
          x-enum-varnames:
            [Hokkaido, Tohoku, Kanto, Chubu, Kinki, Chugoku, Shikoku, KyushuOkinawa]
          example: 北海道

    PrefectureListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: JIS コード順に並んだ47件
          minItems: 47
          maxItems: 47
          items:
            $ref: '#/components/schemas/Prefecture'

    LivezResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]

    ReadyzResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ok]
            database:
              type: string
              enum: [ok]
