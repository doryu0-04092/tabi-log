openapi: 3.0.3

info:
  title: tabi-log API
  version: 0.1.0
  description: |
    旅行写真 SNS「tabi-log」の HTTP API 仕様。

    **このファイルが唯一の正である。** サーバーの型とクライアントの型は
    ここから生成する。実装からこのファイルを生成するのではない。

    前回プロジェクトでは実装から仕様書を生成しており、注釈の解釈違いによって
    「成功レスポンスが存在しない」仕様書が生成される事故を起こしている。
    ビルドもテストも通るため、生成物を目視するまで気づけなかった。
    向きを逆にすることで、実装が仕様から外れた場合は型検査の失敗として現れる。

    生成:
      - Go   : oapi-codegen  -> backend/internal/api/gen/
      - TS   : openapi-typescript -> frontend/src/lib/api/gen.ts
    CI で再生成し、差分が出ないことを検証する。

servers:
  - url: /api
    description: CloudFront（本番）および Vite の proxy（ローカル）が同一オリジンで振り分ける

tags:
  - name: health
    description: 稼働確認
  - name: master
    description: マスタデータ
  - name: auth
    description: 認証
  - name: posts
    description: 投稿と画像

# 既定ですべてのエンドポイントが認証を要する。
# 認証不要のものは各操作で security: [] を明示して打ち消す。
# **既定を「不要」にすると、書き忘れが「認証なしで公開」になる**ため逆にしている。
security:
  - bearerAuth: []

paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: アカウントの作成
      description: |
        作成と同時にログイン状態にする。アクセストークンを本文で返し、
        リフレッシュトークンを Cookie に設定する。

        **メールアドレスの確認は行わない。** メール送信を対象外にしているため、
        存在しないアドレスでも登録できる（要件定義書 3.2 の割り切り）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 作成した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: メールアドレスかハンドルが既に使われている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン
      description: |
        **認証に失敗した理由を区別しない。** 「そのアドレスは登録されていない」と
        「パスワードが違う」を分けて返すと、どのアドレスが登録済みかを
        総当たりで調べられる。どちらも同じ `invalid_credentials` を返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログインした
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: メールアドレスかパスワードが正しくない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: アクセストークンの再発行
      description: |
        Cookie のリフレッシュトークンから新しいアクセストークンを発行し、
        **リフレッシュトークン自体もローテーションする**（新規発行＋旧失効）。

        **失効済みトークンの再提示は盗用の兆候とみなし、そのユーザーの
        全トークンを失効させる。** ただし正規のローテーション直後の短い猶予時間内は
        例外とする。タブを複数開いた利用者の同時リフレッシュを
        誤って盗用と判定し、正常な利用者をログアウトさせないためである。

        このエンドポイントは Cookie で認証するため CSRF の対象になる。
        `SameSite=Strict` に加えて `X-Requested-With: tabi-log` の付与を要求する。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      responses:
        '200':
          description: 再発行した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            リフレッシュトークンが無い・期限切れ・失効済みである。
            `code` が `token_reuse_detected` の場合は盗用とみなして
            全トークンを失効させており、再ログインが必要になる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/CsrfRejected'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      description: |
        リフレッシュトークンを失効させ、Cookie を削除する。

        **発行済みのアクセストークンは最大15分間有効なままである。**
        取り消すにはリクエストごとに失効一覧を参照する必要があり、
        JWT を使う意味が薄れるため行わない。仕様上の制約として受け入れている。

        トークンが無い場合も 204 を返す（冪等）。
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      responses:
        '204':
          description: ログアウトした（トークンが無い場合も含む）
          headers:
            Set-Cookie:
              description: リフレッシュトークンを削除する `Set-Cookie`
              schema:
                type: string
        '403':
          $ref: '#/components/responses/CsrfRejected'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン中の利用者
      description: アクセストークンが指す利用者を返す。画面の初期化に使う。
      responses:
        '200':
          description: ログイン中の利用者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /media/presign:
    post:
      tags: [posts]
      operationId: presignMediaUpload
      summary: 画像アップロード用の署名付きURLを発行する
      description: |
        画像はブラウザから S3 へ直接送る。バックエンドを経由させないのは、
        大きなファイルでサーバーの帯域とタイムアウトがボトルネックになるのを
        避けるためである。

        **署名付きURLを発行する時点で `media` を `pending` として記録する。**
        「アップロードされる予定」を先に永続化しておかないと、送信後に投稿が
        確定されなかった分だけ S3 に誰も参照しないオブジェクトが溜まり続け、
        後から特定する手立てが無くなる。

        アップロード後、S3 のイベントで起動する処理が形式を検証し、
        **EXIF（GPS座標・撮影日時）を除去**して表示用の変換物を作る。
        その処理が完了して `processed` になった画像だけが投稿に使える。

        署名には Content-Type と最大サイズが焼き込まれる。条件に合わない
        アップロードは S3 側で拒否される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '201':
          description: 発行した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /posts:
    post:
      tags: [posts]
      operationId: createPost
      summary: 投稿を作成する
      description: |
        画像・本文・都道府県・訪問日・タグをまとめて確定する。

        **投稿本体・画像の紐づけ・タグの登録を1つのトランザクションで行う。**
        分かれていると、途中で失敗したときに「画像の無い投稿」や
        「どの投稿にも属さない画像」が残る。

        指定できる画像は、**自分がアップロードし、処理が完了しており
        （`processed`）、まだどの投稿にも紐づいていないもの**に限る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'

    get:
      tags: [posts]
      operationId: getPost
      summary: 投稿を取得する
      responses:
        '200':
          description: 投稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [posts]
      operationId: updatePost
      summary: 投稿を編集する
      description: |
        **画像の差し替えは対象外**（要件定義書 3.2）。本文・都道府県・
        スポット名・訪問日・タグ・代替テキストを変更できる。

        **自分の投稿であることをサーバー側で検証する。**
        画面側の制御は操作性のためであり、権限の根拠にはしない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: 更新した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [posts]
      operationId: deletePost
      summary: 投稿を削除する
      description: |
        コメント・いいね・タグの紐づけ・画像が連鎖して削除される。
        S3 上のオブジェクトはデータベースの制約では消えないため、
        アプリケーションから明示的に削除する。
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /prefectures:
    get:
      tags: [master]
      operationId: listPrefectures
      summary: 都道府県マスタの一覧
      description: |
        47件を JIS X 0401 のコード順で返す。投稿フォームの選択肢と、
        都道府県制覇マップの土台に使う。

        **認証を要さない。** 総務省が定める公開情報であり、
        利用者ごとに内容が変わらないためである。
        （アプリの他の画面は認証を要する。[要件定義書](requirements.md) 2 章）

        内容は不変なので、クライアントは長期間キャッシュしてよい。
      security: []
      responses:
        '200':
          description: 47件の都道府県
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefectureListResponse'
  /livez:
    get:
      tags: [health]
      operationId: getLivez
      summary: プロセスの生存確認
      description: |
        **依存先を一切見ない。** ロードバランサのヘルスチェックはこちらへ向ける。

        依存先まで確認するヘルスチェックをロードバランサに向けると、
        データベースが一時的に不調になったときに全タスクが同時に unhealthy と
        判定されて一斉に置き換えられる。置き換えてもデータベースは回復しないため
        状況が悪化するだけである。タスクを入れ替えるべき理由になるのは
        「プロセスが生きていないこと」だけである。
      security: []
      responses:
        '200':
          description: プロセスは動作している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: 依存先を含む疎通確認
      description: |
        データベースへの疎通を含めて確認する。デプロイ時の投入判定や
        運用中の状況確認に使う。**ロードバランサのヘルスチェックには使わない。**
      security: []
      responses:
        '200':
          description: すべての依存先へ疎通できる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: いずれかの依存先へ疎通できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: |
        CSRF 対策。値は `tabi-log` 固定。

        カスタムヘッダーは単純リクエストの条件を外れるため、
        クロスオリジンから送るには CORS のプリフライトが通る必要がある。
        フォーム送信や `<img>` のような**プリフライトを伴わない経路では付けられない**。
        `SameSite=Strict` と合わせて二重に守る。
      schema:
        type: string
        enum: [tabi-log]

  headers:
    RefreshTokenCookie:
      description: |
        リフレッシュトークンを設定する `Set-Cookie`。

        `HttpOnly` `Secure` `SameSite=Strict` を付け、
        **`Path=/api/auth` に限定する**。投稿や検索といった他の API リクエストには
        一切乗らないため、Cookie が晒される面が小さくなる。

        `/api/auth/refresh` まで絞らないのは、**ログアウトでも Cookie を読んで
        サーバー側で失効させる必要がある**ためである。より狭い Path にすると
        `/api/auth/logout` へ Cookie が送られず、ブラウザ側で消すことしかできない。
      schema:
        type: string

  responses:
    ValidationError:
      description: 入力が要件を満たしていない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthenticated:
      description: アクセストークンが無い、期限切れ、または不正である
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    CsrfRejected:
      description: CSRF 対策のヘッダーが無い、または値が正しくない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: 試行回数の上限に達した
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 権限が無い（他人の投稿を操作しようとした等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        アクセストークン（JWT・15分）を Authorization ヘッダで送る。

        クライアントはこのトークンを **JavaScript のメモリにのみ保持し、
        localStorage には保存しない**。リロード時はリフレッシュトークン
        （HttpOnly Cookie）から再取得する。

        ヘッダ方式にしていることで、通常の API は CSRF の対象外になる。
        Cookie を用いるのは /auth/refresh と /auth/logout の2本のみである。

  schemas:
    # -----------------------------------------------------------------------
    # 共通のエンベロープ
    #
    # 成功は data、失敗は error で包む。生の値を返さないのは、後から
    # ページネーション情報やメタデータを足すときに形を壊さないためである。
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                機械可読な識別子。**クライアントはこちらで分岐すること。**
                message は表示専用であり、文言の変更で分岐が壊れないようにする。
              example: dependency_unavailable
            message:
              type: string
              description: 利用者に表示する説明。内部構造やスタックは含めない。
              example: データベースへ接続できません

    # -----------------------------------------------------------------------
    # 認証
    # -----------------------------------------------------------------------
    SignupRequest:
      type: object
      required: [email, handle, displayName, password]
      properties:
        email:
          type: string
          # format: email はあえて付けない。
          # コード生成器が専用の型を作り、その型が JSON の復号時に
          # 形式検証を行うため、**どの項目が不正なのかを利用者へ返せなくなる**
          # （本文全体の「形式が正しくありません」に丸められる）。
          # 検証はアプリケーション側で行い、項目ごとの説明を返す。
          description: メールアドレス。ログインIDとして使う
          maxLength: 255
          example: traveler@example.com
        handle:
          type: string
          description: URL に使う識別子。英数字とアンダースコアのみ
          pattern: '^[A-Za-z0-9_]+$'
          minLength: 3
          maxLength: 30
          example: traveler_01
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          example: たびびと
        password:
          type: string
          format: password
          description: |
            8文字以上。**上限を 72 にしているのは bcrypt の制約**である。
            bcrypt は 72 バイトを超える入力を切り捨てるため、
            それ以上を受け付けると「長いほど安全」という利用者の期待を裏切る。
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: メールアドレス
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accessToken, expiresIn, user]
          properties:
            accessToken:
              type: string
              description: |
                JWT。`Authorization: Bearer <token>` で送る。

                **クライアントはこれをメモリにのみ保持し、localStorage に
                保存しない。** 保存すると XSS で読み出せてしまう。
                リロード時は `/auth/refresh` から取り直す。
            expiresIn:
              type: integer
              description: アクセストークンの残り有効秒数
              example: 900
            user:
              $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    User:
      type: object
      description: 公開してよい利用者情報のみを含む。メールアドレスは含めない
      required: [id, handle, displayName]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        handle:
          type: string
          example: traveler_01
        displayName:
          type: string
          example: たびびと
        bio:
          type: string
          nullable: true
          maxLength: 300

    # -----------------------------------------------------------------------
    # 投稿と画像
    # -----------------------------------------------------------------------
    PresignRequest:
      type: object
      required: [contentType, contentLength]
      properties:
        contentType:
          type: string
          description: |
            画像の種類。**この値は署名に焼き込まれる**ため、
            異なる種類でアップロードすると S3 が拒否する。

            ただし申告値を信用はしない。アップロード後に
            マジックバイトで実際の形式を検証する。
          enum: [image/jpeg, image/png, image/webp]
        contentLength:
          type: integer
          format: int64
          description: バイト数。上限も署名に焼き込まれる
          minimum: 1
          maximum: 10485760

    PresignResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [mediaId, uploadUrl, expiresIn]
          properties:
            mediaId:
              type: integer
              format: int64
              description: 投稿を作成するときにこの ID を指定する
            uploadUrl:
              type: string
              description: この URL へ PUT する。**サーバーを経由しない**
            expiresIn:
              type: integer
              description: 署名の有効秒数

    CreatePostRequest:
      type: object
      required: [body, prefectureCode, visitedOn, media]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
        prefectureCode:
          type: string
          description: JIS X 0401 の都道府県コード。**必須**。自由入力は受け付けない
          pattern: '^[0-4][0-9]$'
        spotName:
          type: string
          maxLength: 100
          nullable: true
          description: 「道の駅○○」など。全文検索の対象に含める
        visitedOn:
          type: string
          format: date
          description: |
            訪問日。**投稿日とは別の軸である。** 旅行から帰ったあとに
            まとめて投稿するのが自然な使われ方のため。未来日は受け付けない。
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 50
        media:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/PostMediaInput'

    UpdatePostRequest:
      type: object
      required: [body, prefectureCode, visitedOn, mediaAltTexts]
      description: 画像の差し替えはできない。代替テキストのみ変更できる
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
        prefectureCode:
          type: string
          pattern: '^[0-4][0-9]$'
        spotName:
          type: string
          maxLength: 100
          nullable: true
        visitedOn:
          type: string
          format: date
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 50
        mediaAltTexts:
          type: array
          description: 既にこの投稿に紐づいている画像の代替テキスト
          items:
            $ref: '#/components/schemas/MediaAltText'

    PostMediaInput:
      type: object
      required: [mediaId, altText]
      properties:
        mediaId:
          type: integer
          format: int64
        altText:
          type: string
          description: |
            **必須。** 写真が主役のサービスで代替テキストを任意にすると
            実質的に入力されず、画像が見えない利用者に何も伝わらなくなる。
          minLength: 1
          maxLength: 200

    MediaAltText:
      type: object
      required: [mediaId, altText]
      properties:
        mediaId:
          type: integer
          format: int64
        altText:
          type: string
          minLength: 1
          maxLength: 200

    PostResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Post'

    Post:
      type: object
      required:
        [id, author, body, prefecture, visitedOn, media, tags, likeCount, commentCount, createdAt]
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/User'
        body:
          type: string
        prefecture:
          $ref: '#/components/schemas/Prefecture'
        spotName:
          type: string
          nullable: true
        visitedOn:
          type: string
          format: date
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        tags:
          type: array
          items:
            type: string
        likeCount:
          type: integer
        commentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Media:
      type: object
      required: [id, altText, width, height, thumbUrl, mediumUrl]
      properties:
        id:
          type: integer
          format: int64
        altText:
          type: string
        width:
          type: integer
        height:
          type: integer
        thumbUrl:
          type: string
          description: 長辺320px。一覧で使う
        mediumUrl:
          type: string
          description: 長辺1080px。詳細で使う

    Prefecture:
      type: object
      required: [code, name, nameKana, region]
      properties:
        code:
          type: string
          description: JIS X 0401 の都道府県コード。`01`〜`47` の2桁（先頭のゼロを含む）
          pattern: '^[0-4][0-9]$'
          example: '01'
        name:
          type: string
          example: 北海道
        nameKana:
          type: string
          description: 読み。並べ替えと検索の補助に使う
          example: ほっかいどう
        region:
          type: string
          description: 八地方区分。「関東の投稿」のような粒度での絞り込みに使う
          enum: [北海道, 東北, 関東, 中部, 近畿, 中国, 四国, 九州沖縄]
          # コード生成器は日本語の列挙値から識別子を作れず、
          # Empty / N1 / N2 ... という無意味な定数名を出す（Empty が「北海道」になる）。
          # x-enum-varnames で明示的に名前を与える。
          x-enum-varnames:
            [Hokkaido, Tohoku, Kanto, Chubu, Kinki, Chugoku, Shikoku, KyushuOkinawa]
          example: 北海道

    PrefectureListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: JIS コード順に並んだ47件
          minItems: 47
          maxItems: 47
          items:
            $ref: '#/components/schemas/Prefecture'

    LivezResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]

    ReadyzResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ok]
            database:
              type: string
              enum: [ok]
