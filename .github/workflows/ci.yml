name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ローカルと版を揃える。ずれると「手元では通るが CI で落ちる」が起きる。
  GO_VERSION: '1.27'
  NODE_VERSION: '24' # Active LTS

jobs:
  backend:
    name: バックエンド（Go）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 依存が go.mod と一致していること
        working-directory: backend
        run: |
          go mod download
          go mod verify

      - name: vet
        working-directory: backend
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

      - name: test
        working-directory: backend
        run: go test -race ./...

      - name: build
        working-directory: backend
        run: go build ./...

  database:
    name: データベースを使うテスト（Go）
    runs-on: ubuntu-latest
    # **実際の MySQL に対して SQL を流すテスト。**
    # store と search に書いてあるのは Go のロジックではなく SQL であり、
    # 偽の実装を相手にすると「Go の呼び出しが通ること」しか確認できない。
    # 実行計画（索引で ORDER BY まで解決できているか）も、
    # 実際に EXPLAIN を取るしか確かめようがない。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 環境変数を用意する
        run: cp .env.example .env

      - name: MySQL を起動する
        run: docker compose up -d --wait mysql

      # 開発用とは別のデータベースを使う。
      # テストは各ケースの前に全テーブルを空にするため、
      # 取り違えると開発用のデータが消える（テスト側でも名前を検査している）。
      - name: テスト用のデータベースを作る
        run: |
          docker compose exec -T mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
            CREATE DATABASE IF NOT EXISTS tabilog_test
              CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            GRANT ALL ON tabilog_test.* TO \"tabilog\"@\"%\";
            FLUSH PRIVILEGES;"'

      # **スキーマの用意にマイグレーションをそのまま使う。**
      # テスト側で CREATE TABLE を書くと本番と二重管理になる。
      - name: マイグレーションを適用する
        run: DB_NAME=tabilog_test docker compose run --rm migrate up

      # **-p 1 でパッケージを直列に回す。** 既定では別パッケージの
      # テストが同時に走るが、どちらも同じデータベースを空にしてから
      # 使うため、互いのデータを消し合う。実際に CI で
      # 「入れたはずの利用者が居ない」形で表面化した。
      - name: データベースを使うテスト
        working-directory: backend
        env:
          TEST_DB_DSN: tabilog:change_me_local_only@tcp(127.0.0.1:3306)/tabilog_test?parseTime=true&loc=UTC&multiStatements=true
          # 用意した側が名乗る。これが立っていて DSN が無ければ失敗する
          # （黙って飛ばして緑になるのを防ぐ）。
          TEST_DB_REQUIRED: "1"
        run: go test -count=1 -p 1 ./internal/store/... ./internal/search/...

      - name: 失敗時のログ
        if: failure()
        run: docker compose logs --no-color mysql

  vulnerabilities:
    name: 脆弱性検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # 依存の追加時ではなく、既知の脆弱性が新たに公表されたときにも
      # 気づけるよう、毎回の CI で回す。
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  frontend:
    name: フロントエンド（SvelteKit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存の導入
        working-directory: frontend
        run: npm ci

      # svelte-check に --threshold warning を渡している。
      # Svelte のコンパイラが出す a11y 警告がここで CI を落とす。
      # アクセシビリティを人の目視ではなく機械で担保するための要である。
      - name: 型検査とアクセシビリティ警告
        working-directory: frontend
        run: npm run check

      - name: lint
        working-directory: frontend
        run: npm run lint

      # 書式を明示して揃える。設定が無いと、実行する人ごとに
      # タブとスペース・引用符が入れ替わり、意味の無い差分が出る。
      - name: 書式
        working-directory: frontend
        run: npm run format:check

      - name: 単体テスト
        working-directory: frontend
        run: npm test

      - name: ビルド
        working-directory: frontend
        run: npm run build

  codegen:
    name: 生成物の一致検証
    runs-on: ubuntu-latest
    # 仕様（docs/openapi.yaml）やスキーマ（db/migrations）を変えたのに
    # 再生成を忘れる、という食い違いを機械的に止める。
    # 「生成できたこと」を「内容が正しいこと」の根拠にしないための担保である。
    #
    # go generate は oapi-codegen（API の型）と sqlc（DB の型）の両方を回す。
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Go の型を再生成（oapi-codegen と sqlc）
        working-directory: backend
        run: go generate ./...

      - name: TypeScript の型を再生成
        working-directory: frontend
        run: npm run gen:api

      # git diff ではなく git status --porcelain で見る。
      #
      # git diff は追跡済みファイルの変更しか見ないため、**生成物が誤った場所に
      # 出力された場合を検出できない**。実際にこの構成で、go generate の
      # 作業ディレクトリの取り違えにより生成物が別のパスへ出力され、
      # 本物の生成物が古いまま残る事象を起こしている。
      # 未追跡ファイルも失敗として扱う。
      - name: 生成物が入力と一致していること
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::生成物が仕様・スキーマと一致していません。再生成してコミットしてください。"
            echo "--- git status ---"
            git status --porcelain
            echo "--- git diff ---"
            git diff
            exit 1
          fi
          echo "生成物は入力と一致している"

  e2e:
    name: E2E とアクセシビリティ検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 環境変数を用意する
        run: cp .env.example .env

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # LocalStack の初期化スクリプトがこの zip を読み込んで Lambda を作る。
      # compose を起動する前に用意しておく必要がある。
      - name: 画像処理 Lambda をビルドする
        run: bash docker/build-imageworker.sh

      - name: MySQL・LocalStack・バックエンドを起動する
        run: docker compose up -d --build

      # マイグレーションは起動時に自動適用しない方針のため、明示的に実行する。
      - name: マイグレーションを適用する
        run: docker compose run --rm migrate up

      - name: 疎通を確認する
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/livez
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/readyz

      # 画像の検証・EXIF除去・変換はこの Lambda が担う。
      # 登録されていないと、画像が processed にならず投稿が一切作れない。
      - name: 画像処理 Lambda が登録されていること
        run: |
          state=$(docker compose exec -T localstack awslocal lambda get-function \
            --function-name tabilog-imageworker --query Configuration.State --output text | tr -d '\r')
          echo "state=$state"
          test "$state" = "Active"

      - name: 都道府県マスタが47件あること
        run: |
          count=$(docker compose exec -T mysql mysql -N -B -u tabilog -pchange_me_local_only tabilog \
            -e "SELECT COUNT(*) FROM prefectures;" 2>/dev/null)
          echo "prefectures=$count"
          test "$count" = "47"

      - name: 依存の導入
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E（axe-core によるアクセシビリティ検査を含む）
        working-directory: frontend
        run: npm run test:e2e

      - name: 失敗時のログ
        if: failure()
        run: docker compose logs --no-color

      # **失敗したものは証跡ごと残す。** レポートに加えて
      # スクリーンショットと動画（test-results/ に出る）も上げる。
      # 落ちた理由は実行し直しても再現しないことがあり、
      # その場の画面が無いと原因に辿り着けない。
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  infra:
    name: インフラ（Terraform）
    runs-on: ubuntu-latest
    # **AWS には一切つながない。** fmt と validate は認証を要さず、
    # 書式と構文・型・参照の整合だけを見る。
    # plan は AWS の認証情報が要るため CI では回さない
    # （回すなら読み取り専用の権限を用意してからにする）。
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          # 出力に色付けの制御文字が混ざると読みにくいので切る。
          terraform_wrapper: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # **成果物が無いと validate の時点で落ちる。**
      # lambda.tf が filebase64sha256 で zip を読むため、
      # ファイルが実在しないと関数呼び出しに失敗する。
      # 生成物はリポジトリに置いていないので、ここで作る。
      # 作れること自体も確認になる。
      - name: 画像処理 Lambda をビルドする
        run: bash docker/build-imageworker.sh

      - name: 書式
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      # -backend=false で state に触らずに初期化する。
      # プロバイダの取得だけを行い、ローカルの state ファイルも作らない。
      - name: 初期化（バックエンドなし）
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: 検証
        working-directory: infra
        run: terraform validate
