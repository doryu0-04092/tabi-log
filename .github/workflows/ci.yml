name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ローカルと版を揃える。ずれると「手元では通るが CI で落ちる」が起きる。
  GO_VERSION: '1.27'
  NODE_VERSION: '24' # Active LTS

jobs:
  backend:
    name: バックエンド（Go）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: 依存が go.mod と一致していること
        working-directory: backend
        run: |
          go mod download
          go mod verify

      - name: vet
        working-directory: backend
        run: go vet ./...

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: test
        working-directory: backend
        run: go test -race ./...

      - name: build
        working-directory: backend
        run: go build ./...

  vulnerabilities:
    name: 脆弱性検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # 依存の追加時ではなく、既知の脆弱性が新たに公表されたときにも
      # 気づけるよう、毎回の CI で回す。
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  frontend:
    name: フロントエンド（SvelteKit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存の導入
        working-directory: frontend
        run: npm ci

      # svelte-check に --threshold warning を渡している。
      # Svelte のコンパイラが出す a11y 警告がここで CI を落とす。
      # アクセシビリティを人の目視ではなく機械で担保するための要である。
      - name: 型検査とアクセシビリティ警告
        working-directory: frontend
        run: npm run check

      - name: lint
        working-directory: frontend
        run: npm run lint

      - name: 単体テスト
        working-directory: frontend
        run: npm test

      - name: ビルド
        working-directory: frontend
        run: npm run build

  codegen:
    name: 生成物の一致検証
    runs-on: ubuntu-latest
    # 仕様（docs/openapi.yaml）を変えたのに再生成を忘れる、という食い違いを
    # 機械的に止める。「生成できたこと」を「内容が正しいこと」の根拠にしない
    # ための仕組み側の担保である。
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Go の型を再生成
        working-directory: backend
        run: go generate ./...

      - name: TypeScript の型を再生成
        working-directory: frontend
        run: npm run gen:api

      - name: 差分が無いこと
        run: |
          if ! git diff --exit-code; then
            echo "::error::生成物が docs/openapi.yaml と一致していません。再生成してコミットしてください。"
            exit 1
          fi

  e2e:
    name: E2E とアクセシビリティ検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 環境変数を用意する
        run: cp .env.example .env

      - name: MySQL とバックエンドを起動する
        run: docker compose up -d --build

      # マイグレーションは起動時に自動適用しない方針のため、明示的に実行する。
      - name: マイグレーションを適用する
        run: docker compose run --rm migrate up

      - name: 疎通を確認する
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/livez
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/readyz

      - name: 都道府県マスタが47件あること
        run: |
          count=$(docker compose exec -T mysql mysql -N -B -u tabilog -pchange_me_local_only tabilog \
            -e "SELECT COUNT(*) FROM prefectures;" 2>/dev/null)
          echo "prefectures=$count"
          test "$count" = "47"

      - name: 依存の導入
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E（axe-core によるアクセシビリティ検査を含む）
        working-directory: frontend
        run: npm run test:e2e

      - name: 失敗時のログ
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

# インフラの検証ジョブ（terraform fmt -check / validate）は infra/ に
# Terraform のコードを置いた時点で追加する。検証対象が無い状態でジョブだけ
# 置くと「通っている」という誤った印象を与えるため、今は入れていない。
