# sqlc の設定。
#
# 自分で書いた SQL から、型安全な Go の関数を生成する。ORM ではない。
# 生成物は internal/store/dbgen/ に出る。直接編集しない。
#
# 生成（backend ディレクトリで実行）:
#   go generate ./...
#
# ---------------------------------------------------------------------------
# ここに書いてある設定は、すべて実際に効くことを確認したものだけである。
# 「書いたが黙って無視されていた」設定を3件除去した経緯は末尾に記す。
# ---------------------------------------------------------------------------
version: "2"

sql:
  - engine: mysql

    # schema にマイグレーションのディレクトリを指定しているのが要点である。
    # sqlc は CREATE TABLE を読んで列の型と NULL 許容を把握するため、
    # **実際に適用されるスキーマと生成コードが常に同じ根拠を持つ**。
    # 別途スキーマ定義を手で持つと、そちらだけ古くなって静かに食い違う。
    schema: db/migrations
    queries: db/queries

    gen:
      go:
        package: dbgen
        out: internal/store/dbgen
        sql_package: database/sql

        # DB の行構造体に JSON タグを付けない。
        # 行をそのまま API のレスポンスとして返す作りにすると、
        # 列を1つ足しただけで API の出力が変わってしまう。変換は明示的に書く。
        emit_json_tags: false

        # 0 件のときに nil ではなく空スライスを返す。
        # JSON にしたときに null と [] が混ざるのを防ぐ。
        emit_empty_slices: true

        rename:
          # sqlc は media を英語の複数形とみなし Medium という型名を作る。
          # **キーはテーブル名ではなく sqlc が生成した名前（小文字）である。**
          # "media" と書いても効かない。実験して "medium" が正解と確認した。
          medium: "Media"

# ---------------------------------------------------------------------------
# 設定しなかったもの（実験して効かないことを確認した）
#
# - emit_pointers_for_null_types
#     NULL 許容列を *string 等にするオプション。**MySQL では非対応**であり、
#     書いてもエラーにならず黙って無視される（公式ドキュメントで確認）。
#     対応しているのは PostgreSQL(pgx) と SQLite のみ。
#     そのため NULL 許容列は sql.NullString / sql.NullTime 等になる。
#     扱いやすい型に直すのは store 層の仕事とする。
#
# - overrides で bigint unsigned を uint64 にする指定
#     **書いても書かなくても生成結果が同一**だった（生成物を diff して確認）。
#     sqlc の MySQL 既定が既に uint64 のためである。
#     効かない設定を残すと「これで型が保証されている」という誤解を生むので消した。
#
# - emit_methods_with_db_argument
#     トランザクション対応に要ると考えたが不要だった。
#     生成される Queries は DBTX インターフェースを受け取るため
#     *sql.DB と *sql.Tx の両方を渡せ、WithTx(tx) も生成される。
#     いいね数の更新や通知の作成を本体と同一トランザクションで行う要件は、
#     既定の生成物のままで満たせる。
# ---------------------------------------------------------------------------
