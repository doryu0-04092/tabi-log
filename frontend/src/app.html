<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
			**SPA なので、ここに書いた説明が全ページ共通になる。**
			ページごとに変えるには SSR が要る（adapter-static + SPA では
			クローラに個別の説明を出せない）。この割り切りは
			docs/tech-stack.md に書いてある OGP の話と同じ理由である。
		-->
		<meta
			name="description"
			content="旅行先の写真と記録を共有する SNS です。都道府県ごとに投稿を残し、訪れた場所を地図で振り返れます。"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!--
			ロゴだけに使う欧文の表示用書体。**本文には使わない。**
			日本語のウェブフォントは数百KBになり、見た目の差に対して
			読み込みの代償が大きい。display=swap なので、読めなくても
			代替の書体で表示は成立する。
		-->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
